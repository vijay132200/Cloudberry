# Nixpacks config for the standalone API Server Railway service.
# In Railway dashboard: set "Source Root" to "artifacts/api-server".
#
# pnpm install must run from the monorepo root (/app) so that
# workspace:* dependencies resolve correctly across packages.

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = [
  "npm install -g corepack@0.24.1 --quiet --no-progress && corepack enable",
  "cd /app && pnpm install --no-frozen-lockfile"
]

[phases.build]
cmds = ["cd /app && pnpm --filter @workspace/api-server run build"]
