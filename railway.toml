[build]
builder = "nixpacks"
# nixpacks.toml handles the install phase (Node 20 + pnpm install).
# This command only runs the two compile steps that produce deployable output.
buildCommand = "BASE_PATH=/ pnpm --filter @workspace/cloudberry run build && pnpm --filter @workspace/api-server run build"

[deploy]
# Single service: Express serves /api/* and the Vite SPA static files.
startCommand = "NODE_ENV=production pnpm --filter @workspace/api-server run start"
# Must match the route registered in artifacts/api-server/src/routes/health.ts
healthcheckPath = "/api/healthz"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
